server {
    listen 80;

    include /etc/nginx/mime.types;

    # 白捡优化（wayfinder/seo-multilang 票 08）：显式 gzip——
    # nginx 镜像默认只压 text/html，js/css/json 均未压缩（实测 410KB 首屏直传）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain application/xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 旧无前缀路径 → /zh/*（服务端 301，规格 D3；sitemap 不列旧路径；
    # 保持 301 至少 6 个月让索引迁移，见 GSC 手册）
    location ~ ^/(2d|3d|about|privacy|terms|help|license)$ {
        return 301 /zh/$1$is_args$args;
    }

    # 静态资源长缓存（带 hash 的 js/css/图片）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # og-image 不走长缓存，方便更新
    location = /og-image.png {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML（多语言预渲染页 + 根分发 stub）：协商缓存，保证部署即生效
    # （location 内 add_header 会屏蔽 server 级继承，安全头需在此重复声明）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;

        # SPA 刷新 404 兜底
        try_files $uri $uri/ /index.html;
    }
}
