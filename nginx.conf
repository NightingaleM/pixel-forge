# nginx 低内存配置
worker_processes 1;          # 只用 1 个工作进程（默认 auto 会按 CPU 核心数开）

events {
    worker_connections 256;  # 降低并发连接数（默认 1024）
}

http {
    include /etc/nginx/mime.types;

    # 关闭访问日志，减少磁盘 IO 和内存占用
    access_log off;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;

            # SPA 单页应用：刷新时返回 index.html 而非 404
            try_files $uri $uri/ /index.html;

            # 静态资源强缓存，减少重复请求
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
