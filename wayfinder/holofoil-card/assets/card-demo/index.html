<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全息箔闪卡 · 转卡手感 demo</title>
<style>
  :root {
    --bg0: #0e0f16; --bg1: #191b28; --panel: #1e2130; --line: #2c3044;
    --ink: #e8eaf2; --ink-dim: #9aa0b4; --accent: #7ee0c3; --accent-dim: #3d6f60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 700px at 62% 38%, var(--bg1), var(--bg0));
    min-height: 100%;
    display: flex; flex-direction: column;
  }
  header {
    padding: 18px 26px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
  header .sub { color: var(--ink-dim); font-size: 12.5px; }
  header svg { flex: none; }
  main {
    flex: 1; display: grid;
    grid-template-columns: 1fr 312px;
    gap: 18px; padding: 6px 26px 26px;
    align-items: stretch;
    min-height: 0;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

  /* ---------- 舞台与卡片 ---------- */
  .stage {
    position: relative;
    perspective: 1100px;
    display: flex; align-items: center; justify-content: center;
    min-height: 480px;
    touch-action: none; /* 触摸转卡,不给页面滚动 */
    cursor: crosshair;
    border: 1px dashed var(--line); border-radius: 16px;
  }
  .stage .hint {
    position: absolute; left: 14px; top: 12px;
    color: var(--ink-dim); font-size: 12px; pointer-events: none;
  }
  .card {
    position: relative;
    width: min(58vh, 46vw, 460px);
    aspect-ratio: var(--ar, 3/2);
    border-radius: 16px;
    transform-style: preserve-3d;
    background: #000;
    box-shadow: 0 18px 44px rgba(5, 7, 14, 0.55);
    will-change: transform;
    overflow: hidden;
    outline: 1px solid rgba(255, 255, 255, 0.06);
  }
  .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* 高光微动层:斜向光带随倾角滑移 */
  .card .gloss {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0.26) 50%,
      rgba(255,255,255,0) 60%);
    background-size: 240% 100%;
    background-position: 50% 0;
    mix-blend-mode: screen;
  }
  /* 侧旋暗角:转到边缘时卡缘变暗 */
  .card .vignette {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background:
      linear-gradient(to right, rgba(0,0,0,0.42), rgba(0,0,0,0) 26% 74%, rgba(0,0,0,0.42)),
      linear-gradient(to bottom, rgba(0,0,0,0.30), rgba(0,0,0,0) 30% 70%, rgba(0,0,0,0.30));
  }
  .stage.nolight .gloss, .stage.nolight .vignette { display: none; }

  /* ---------- 控制面板 ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 14px;
    align-self: start;
  }
  .panel h2 { font-size: 12.5px; color: var(--ink-dim); font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: inherit; font-size: 12.5px; color: var(--ink-dim);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; cursor: pointer; transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent-dim); color: var(--ink); }
  .chip.on { color: #0d1a15; background: var(--accent); border-color: var(--accent); font-weight: 600; }

  .row { display: flex; align-items: center; gap: 10px; }
  .row label { flex: none; width: 74px; color: var(--ink-dim); font-size: 12.5px;
    display: flex; align-items: center; gap: 5px; }
  .row output { flex: none; width: 44px; text-align: right;
    font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--accent); }
  input[type="range"] {
    flex: 1; appearance: none; height: 3px; border-radius: 2px;
    background: var(--line); outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 3px solid #14201b;
    box-shadow: 0 0 0 1px var(--accent-dim);
  }

  .toggles { display: flex; flex-direction: column; gap: 9px; }
  .toggle { display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .toggle .track {
    flex: none; width: 34px; height: 19px; border-radius: 999px;
    background: var(--line); position: relative; transition: background 0.15s;
  }
  .toggle .track::after {
    content: ""; position: absolute; left: 3px; top: 3px;
    width: 13px; height: 13px; border-radius: 50%; background: #8b91a6;
    transition: all 0.15s;
  }
  .toggle input:checked + .track { background: var(--accent-dim); }
  .toggle input:checked + .track::after { left: 18px; background: var(--accent); }
  .toggle .tlabel { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .toggle .tdesc { color: var(--ink-dim); font-size: 11.5px; }

  .readout {
    border-top: 1px solid var(--line); padding-top: 10px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px;
    font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-dim);
  }
  .readout b { color: var(--ink); font-weight: 600; }
  .readout .mode { color: var(--accent); }
  footer { padding: 0 26px 16px; color: var(--ink-dim); font-size: 11.5px; }
</style>
</head>

          <span class="tlabel">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M1 9 C 3 5.5, 5 12.5, 7 9 S 11 5.5, 13 9" stroke="#9aa0b4" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M1 4.5 C 3 1, 5 8, 7 4.5 S 11 1, 13 4.5" stroke="#9aa0b4" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
            </svg>

        <label class="toggle">

          <span class="tlabel">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 7 A 5 5 0 0 1 12 7" stroke="#9aa0b4" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M4.6 5.6 L 2 7 L 3.4 9.6" stroke="#9aa0b4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>

          </span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="light" checked>
          <span class="track"></span>
          <span class="tlabel">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="6" cy="6" r="2.6" stroke="#9aa0b4" stroke-width="1.3"/>
              <path d="M6 1.2 V 2.4 M6 9.6 V 10.8 M1.2 6 H 2.4 M9.6 6 H 10.8 M2.6 2.6 L 3.4 3.4 M8.6 8.6 L 9.4 9.4 M2.6 9.4 L 3.4 8.6 M8.6 3.4 L 9.4 2.6" stroke="#9aa0b4" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
            阴影 / 高光微动
            <span class="tdesc">立体感来源</span>

        </label>
      </div>
    </div>

    <div class="readout" id="readout">
      <span>rotateX <b id="roX">0.0°</b></span>
      <span>rotateY <b id="roY">0.0°</b></span>
      <span>状态 <b class="mode" id="roMode">待机</b></span>
      <span>帧率 <b id="roFps">--</b></span>
    </div>
  </aside>
</main>

<!-- holofoil fragment: src/shaders/holofoil.frag 原版 + 倾角注入(uTiltX/uTiltY 驱动色带相位) -->
<script id="fs-src" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uImage;
uniform vec2 uResolution;      /* = 纹理分辨率:采样步进按纹理走(票03 教训) */
uniform float uTexture;
uniform float uStrength;
uniform float uBandDensity;
uniform float uBandAngle;
uniform float uFoilColorR;
uniform float uFoilColorG;
uniform float uFoilColorB;
uniform float uCrackleDensity;
uniform float uStreakDensity;
uniform float uSparkleDensity;
uniform float uTiltX;          /* -1..1 归一化倾角 */
uniform float uTiltY;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
vec3 hsv2rgb(vec3 c) {
  vec3 p = abs(fract(c.xxx + vec3(0.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}

void main() {
  vec2 px = 1.0 / uResolution;
  vec3 base = texture2D(uImage, vUv).rgb;
  float lC = luma(base);

  float lx = luma(texture2D(uImage, vUv + vec2(px.x * 2.0, 0.0)).rgb)
           - luma(texture2D(uImage, vUv - vec2(px.x * 2.0, 0.0)).rgb);
  float ly = luma(texture2D(uImage, vUv + vec2(0.0, px.y * 2.0)).rgb)
           - luma(texture2D(uImage, vUv - vec2(0.0, px.y * 2.0)).rgb);
  vec2 grad = vec2(lx, ly);

  float a = radians(uBandAngle);
  vec2 dir = vec2(cos(a), sin(a));

  float grain;
  float band;
  float sat;
  float sparkleThresh;
  if (uTexture < 0.5) {
    grain = vnoise(vUv * uCrackleDensity);
    band = dot(vUv, dir) * 4.0 * uBandDensity + grad.x * 7.0 + grad.y * 5.0 + grain * 2.4;
    sat = 0.85;
    sparkleThresh = 0.985;
  } else if (uTexture < 1.5) {
    grain = vnoise(vec2(vUv.x * 1.5, vUv.y * uStreakDensity * 3.0));
    band = dot(vUv, dir) * 4.0 * uBandDensity + grad.y * 6.0 + grain * 3.0;
    sat = 0.80;
    sparkleThresh = 0.99;
  } else {
    grain = vnoise(vUv * uCrackleDensity * 0.8);
    band = dot(vUv, dir) * 4.0 * uBandDensity + grad.x * 4.0 + grad.y * 3.0 + grain * 1.5;
    sat = 0.45;
    sparkleThresh = 0.975;
  }

  /* 转卡注入:倾角向量投影到色带方向,随转卡平移色带相位(增益 2.6 = 满幅约 0.4 个谱周期) */
  band += dot(vec2(uTiltX, uTiltY), dir) * 2.6;

  vec3 spectrum = hsv2rgb(vec3(fract(band * 0.35), sat, 1.0));

  float edge = length(grad) * 4.0;
  float mask = smoothstep(0.32, 0.85, lC * 0.75 + edge) * (0.55 + 0.45 * grain);

  vec3 foilBase = mix(vec3(luma(base)), base, 0.35);
  foilBase = foilBase * 0.45 + vec3(uFoilColorR, uFoilColorG, uFoilColorB) * 0.55;

  vec3 col = foilBase + spectrum * mask * 0.95 * uStrength;

  float sparkle = step(sparkleThresh, hash(floor(vUv * uResolution * 0.5 * uSparkleDensity))) * mask;
  col += sparkle * 0.6;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script src="images.js"></script>
<script>
'use strict';
/* ---------------- 状态 ---------------- */
const state = {
  imgKey: 'cartoon', texture: 0, strength: 1,
  amp: 12, flow: true, idle: true, light: true,
  tx: 0, ty: 0,          /* 目标倾角 -1..1 */
  cx: 0, cy: 0,          /* 平滑后倾角 -1..1 */
  lastPointer: performance.now(),
  idleActive: false,
  glOk: false,
};
window.__err = '';
window.__read = { rx: 0, ry: 0, cx: 0, cy: 0, idleActive: false, glOk: false };
window.addEventListener('error', e => { window.__err = window.__err || e.message; });

const stage = document.getElementById('stage');
const card = document.getElementById('card');
const canvas = document.getElementById('foil');
const gloss = document.getElementById('gloss');
const vignette = document.getElementById('vignette');
const hint = document.getElementById('hint');

/* ---------------- WebGL(holofoil 实时,倾角作 uniform) ---------------- */
const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
let prog, uni = {}, tex, texW = 1, texH = 1;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
try {
  const vs = compile(gl.VERTEX_SHADER,
    'attribute vec2 aPos; varying vec2 vUv;' +
    'void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }');
  const fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs-src').textContent);
  prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uImage','uResolution','uTexture','uStrength','uBandDensity','uBandAngle',
    'uFoilColorR','uFoilColorG','uFoilColorB','uCrackleDensity','uStreakDensity',
    'uSparkleDensity','uTiltX','uTiltY']) uni[n] = gl.getUniformLocation(prog, n);
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); /* 与 app ShaderRenderer 一致,否则图片上下颠倒 */
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  state.glOk = true;
} catch (e) {
  window.__err = 'WebGL: ' + e.message;
  hint.textContent = 'WebGL 初始化失败: ' + e.message;
}

/* app 默认参数(StyleRegistry holofoil 定稿值) */
const PARAMS = {
  uBandDensity: 1, uBandAngle: 22,
  uFoilColor: [0x1a / 255, 0x1a / 255, 0x22 / 255],
  uCrackleDensity: 38, uStreakDensity: 14, uSparkleDensity: 1,
};

function setImage(key) {
  state.imgKey = key;
  const img = new Image();
  img.onload = () => {
    texW = img.naturalWidth; texH = img.naturalHeight;
    card.style.setProperty('--ar', texW + '/' + texH);
    if (state.glOk) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    }
    sizeCanvas();
    needDraw = true;
  };
  img.onerror = () => { window.__err = window.__err || 'image load fail: ' + key; };
  img.src = window.CARD_IMAGES[key];
}

let needDraw = true;
let lastDrawnTilt = [99, 99];

function sizeCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = canvas.getBoundingClientRect();
  const w = Math.max(2, Math.round(r.width * dpr));
  const h = Math.max(2, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    gl && gl.viewport(0, 0, w, h);
    needDraw = true;
  }
}
window.addEventListener('resize', sizeCanvas);

function draw() {
  if (!state.glOk) return;
  const fx = state.flow ? state.cx : 0;
  const fy = state.flow ? state.cy : 0;
  gl.uniform1i(uni.uImage, 0);
  gl.uniform2f(uni.uResolution, texW, texH);
  gl.uniform1f(uni.uTexture, state.texture);
  gl.uniform1f(uni.uStrength, state.strength);
  gl.uniform1f(uni.uBandDensity, PARAMS.uBandDensity);
  gl.uniform1f(uni.uBandAngle, PARAMS.uBandAngle);
  gl.uniform1f(uni.uFoilColorR, PARAMS.uFoilColor[0]);
  gl.uniform1f(uni.uFoilColorG, PARAMS.uFoilColor[1]);
  gl.uniform1f(uni.uFoilColorB, PARAMS.uFoilColor[2]);
  gl.uniform1f(uni.uCrackleDensity, PARAMS.uCrackleDensity);
  gl.uniform1f(uni.uStreakDensity, PARAMS.uStreakDensity);
  gl.uniform1f(uni.uSparkleDensity, PARAMS.uSparkleDensity);
  gl.uniform1f(uni.uTiltX, fx);
  gl.uniform1f(uni.uTiltY, fy);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  lastDrawnTilt = [fx, fy];
}

/* ---------------- 交互:指针 → 目标倾角 ---------------- */
function pointerTo(e) {
  const r = card.getBoundingClientRect();
  const nx = ((e.clientX - r.left) / r.width - 0.5) * 2;
  const ny = ((e.clientY - r.top) / r.height - 0.5) * 2;
  state.tx = Math.max(-1.35, Math.min(1.35, nx));  /* 超出卡面仍有余量,钳到 1.35 满幅感 */
  state.ty = Math.max(-1.35, Math.min(1.35, ny));
  state.lastPointer = performance.now();
}
stage.addEventListener('pointermove', pointerTo);
stage.addEventListener('pointerdown', pointerTo);
stage.addEventListener('pointerenter', pointerTo);
stage.addEventListener('pointerleave', () => {
  state.tx = 0; state.ty = 0;   /* 离开即缓回正;若 idle 开,2.5s 后自摆接管 */
  state.lastPointer = performance.now();
});
/* 触摸抬手 = 离开语义(回正/交自摆) */
stage.addEventListener('pointerup', () => {
  state.tx = 0; state.ty = 0;
  state.lastPointer = performance.now();
});

/* ---------------- 主循环 ---------------- */
const IDLE_DELAY = 2500;
let lastDomUpdate = 0;
let fpsT = performance.now(), fpsN = 0;

function loop(t) {
  /* idle 自摆:静止 2.5s 后轻摆(Lissajous 式小圈,幅度挂钩 amp) */
  const idleOn = state.idle && (t - state.lastPointer > IDLE_DELAY);
  state.idleActive = idleOn;
  if (idleOn) {
    const swing = 0.42;                    /* 满幅比例:12° 时约 ±5° */
    state.tx = Math.sin(t / 1500) * swing;
    state.ty = Math.cos(t / 1800) * swing * 0.72;
  }

  /* 阻尼平滑 */
  state.cx += (state.tx - state.cx) * 0.10;
  state.cy += (state.ty - state.cy) * 0.10;

  const rx = (-state.cy * state.amp).toFixed(2) * 1;
  const ry = (state.cx * state.amp).toFixed(2) * 1;
  card.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';

  /* 光效微动 */
  const fx = state.flow ? state.cx : 0;
  if (state.light) {
    gloss.style.backgroundPosition = ((0.5 - fx * 0.5) * 100).toFixed(1) + '% 0';
    vignette.style.opacity = Math.min(0.85, (Math.abs(state.cx) + Math.abs(state.cy)) * 0.55).toFixed(3);
    card.style.boxShadow = (-state.cx * 13).toFixed(1) + 'px ' + (16 + state.cy * 9).toFixed(1)
      + 'px 44px 3px rgba(5,7,14,0.55)';
  } else {
    card.style.boxShadow = '0 18px 44px rgba(5,7,14,0.55)';
  }
  stage.classList.toggle('nolight', !state.light);

  /* WebGL 按需重渲 */
  const fxNow = state.flow ? state.cx : 0;
  const fyNow = state.flow ? state.cy : 0;
  if (needDraw || Math.abs(fxNow - lastDrawnTilt[0]) > 0.0015 || Math.abs(fyNow - lastDrawnTilt[1]) > 0.0015) {
    draw();
    needDraw = false;
  }

  /* 读数 */
  window.__read.rx = +rx; window.__read.ry = +ry;
  window.__read.cx = +state.cx.toFixed(4); window.__read.cy = +state.cy.toFixed(4);
  window.__read.idleActive = idleOn;
  if (t - lastDomUpdate > 120) {
    lastDomUpdate = t;
    document.getElementById('roX').textContent = rx.toFixed(1) + '°';
    document.getElementById('roY').textContent = ry.toFixed(1) + '°';
    document.getElementById('roMode').textContent = idleOn ? '自摆中' : '交互中';
  }
  fpsN++;
  if (t - fpsT > 800) {
    document.getElementById('roFps').textContent = Math.round(fpsN * 1000 / (t - fpsT));
    fpsT = t; fpsN = 0;
  }
  requestAnimationFrame(loop);
}

/* ---------------- 面板接线 ---------------- */
function chipGroup(el, attr, fn) {
  el.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    el.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    fn(b.dataset[attr]);
  });
}
chipGroup(document.getElementById('imgChips'), 'img', k => setImage(k));
chipGroup(document.getElementById('texChips'), 'tex', v => { state.texture = +v; needDraw = true; });

const ampEl = document.getElementById('amp');
ampEl.addEventListener('input', () => {
  state.amp = +ampEl.value;
  document.getElementById('ampOut').textContent = state.amp + '°';
});
const stEl = document.getElementById('strength');
stEl.addEventListener('input', () => {
  state.strength = +stEl.value;
  document.getElementById('strengthOut').textContent = state.strength.toFixed(2);
  needDraw = true;
});
document.getElementById('flow').addEventListener('change', e => { state.flow = e.target.checked; needDraw = true; });
document.getElementById('idle').addEventListener('change', e => { state.idle = e.target.checked; });
document.getElementById('light').addEventListener('change', e => { state.light = e.target.checked; });

/* ---------------- 启动 ---------------- */
window.__read.glOk = state.glOk;
setImage(state.imgKey);
requestAnimationFrame(loop);
</script>
</body>
</html>
